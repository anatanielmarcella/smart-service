<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
    <title>Smart Service — Cadastro</title>
</head>

<body>

    <div class="container">

        <!-- Lado esquerdo (igual ao login) -->
        <div class="left-side">
            <div class="brand">
                <h2>Smart Service</h2>
            </div>
            <img src="img/vw-nivus.png" alt="vw-nivus">
        </div>

        <!-- Lado direito — formulário de cadastro -->
        <div class="right-side right-side-cadastro">
            <div class="login-box cadastro-box">

                <h1>Crie sua conta</h1>
                <p>Preencha seus dados para começar<br>a <span>cuidar do seu veículo</span></p>

                <form>

                    <!-- Nome completo -->
                    <div class="input-group">
                        <label for="nome">Nome completo</label>
                        <div class="input-wrapper">
                            <i data-lucide="user"></i>
                            <input type="text" id="nome" placeholder="Digite seu nome completo">
                        </div>
                    </div>

                    <!-- CPF e RG lado a lado -->
                    <div class="input-row">
                        <div class="input-group">
                            <label for="cpf">CPF</label>
                            <div class="input-wrapper">
                                <i data-lucide="id-card"></i>
                                <input type="text" id="cpf" placeholder="000.000.000-00">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="rg">RG</label>
                            <div class="input-wrapper">
                                <i data-lucide="file-text"></i>
                                <input type="text" id="rg" placeholder="00.000.000-0">
                            </div>
                        </div>
                    </div>

                    <!-- Data de nascimento e Telefone lado a lado -->
                    <div class="input-row">
                        <div class="input-group">
                            <label for="nascimento">Data de nascimento</label>
                            <div class="input-wrapper">
                                <i data-lucide="calendar"></i>
                                <input type="date" id="nascimento">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="telefone">Telefone</label>
                            <div class="input-wrapper">
                                <i data-lucide="phone"></i>
                                <input type="text" id="telefone" placeholder="(00) 00000-0000">
                            </div>
                        </div>
                    </div>

                    <!-- CEP e Número lado a lado -->
                    <div class="input-row">
                        <div class="input-group">
                            <label for="cep">CEP</label>
                            <div class="input-wrapper">
                                <i data-lucide="map-pin"></i>
                                <input type="text" id="cep" placeholder="00000-000">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="numero">Número da residência</label>
                            <div class="input-wrapper">
                                <i data-lucide="home"></i>
                                <input type="text" id="numero" placeholder="Digite o número">
                            </div>
                        </div>
                    </div>

                    <!-- E-mail -->
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="Digite seu e-mail">
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" placeholder="Crie uma senha">
                            <span class="toggle-password" onclick="togglePassword()">
                                <i data-lucide="eye" id="eye-icon"></i>
                            </span>
                        </div>
                    </div>

                    <button type="button" onclick="if(validarCadastro()) salvarDadosCadastro()">Continuar</button>

                </form>

                <!-- Link para voltar ao login -->
                <p class="login-link">Já tem uma conta? <a href="index.html">Faça login</a></p>

            </div>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="script.js"></script>
    <script src="mascaras.js"></script>
    <script>lucide.createIcons();</script>

</body>

</html>
